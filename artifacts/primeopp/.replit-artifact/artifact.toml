kind = "web"
previewPath = "/"
title = "PrimeOpp"
version = "1.0.0"
id = "artifacts/primeopp"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 22295
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/primeopp run dev"

[services.env]
PORT = "22295"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/primeopp", "run", "build"]
publicDir = "artifacts/primeopp/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
